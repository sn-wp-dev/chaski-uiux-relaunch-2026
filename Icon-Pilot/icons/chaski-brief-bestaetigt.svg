<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="mail-title" class="chaski-brief">
  <title id="mail-title">Brief mit Bestätigungshäkchen</title>
  <defs>
    <linearGradient id="mail-paper" x1="65" y1="91" x2="178" y2="191" gradientUnits="userSpaceOnUse"><stop stop-color="#F6F8F3"/><stop offset=".55" stop-color="#E3EAD8"/><stop offset="1" stop-color="#586937"/></linearGradient>
    <linearGradient id="mail-fold" x1="120" y1="92" x2="127" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E3EAD8"/><stop offset="1" stop-color="#586937"/></linearGradient>
    <linearGradient id="mail-front" x1="87" y1="137" x2="159" y2="216" gradientUnits="userSpaceOnUse"><stop stop-color="#F6F8F3"/><stop offset=".55" stop-color="#E3EAD8"/><stop offset="1" stop-color="#586937"/></linearGradient>
    <linearGradient id="mail-check" x1="165" y1="65" x2="190" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#E3EAD8"/><stop offset=".35" stop-color="#586937"/><stop offset="1" stop-color="#4A562D"/></linearGradient>
    <radialGradient id="mail-shadow"><stop stop-color="#252D15" stop-opacity=".18"/><stop offset="1" stop-color="#252D15" stop-opacity="0"/></radialGradient>
    <filter id="mail-bevel" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#252D15" flood-opacity=".16"/></filter>
    <filter id="mail-badge-shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#252D15" flood-opacity=".18"/></filter>
  </defs>
  <ellipse class="ground" cx="128" cy="211" rx="84" ry="14" fill="url(#mail-shadow)"/>
  <g class="envelope">
    <g transform="rotate(-8 128 142)">
      <rect x="51" y="96" width="158" height="105" rx="10" fill="#4A562D"/>
      <rect x="48" y="90" width="158" height="105" rx="9" fill="url(#mail-paper)"/>
      <path d="M52 190 111 143Q127 131 142 143L202 190Q200 195 196 195H58Q54 195 52 190Z" fill="url(#mail-front)"/>
      <path d="M52 190 111 143M142 143 202 190" fill="none" stroke="#F6F8F3" stroke-opacity=".65" stroke-width="1.5"/>
      <path d="M51 94Q52 90 58 90H196Q202 90 204 94L138 148Q127 157 116 148Z" fill="url(#mail-fold)" filter="url(#mail-bevel)"/>
      <path d="M54 94 118 146Q127 153 136 146L200 94" fill="none" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M50 101V184Q50 193 59 193H194" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.3"/>
