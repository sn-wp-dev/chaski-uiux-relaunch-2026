    <path d="M157 88 172 103 202 68" fill="none" stroke="url(#mail-check)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M155 85 171 100 200 66" fill="none" stroke="#F6F8F3" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
